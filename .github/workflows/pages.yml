name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-deploys once a day so the review scores on the home and About pages pick
  # up new reviews without anyone pushing. Nothing else about the site changes
  # between scheduled runs. Note GitHub disables cron on repos with no activity
  # for 60 days — if the numbers go stale, check that first.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Refreshes the park4night review score in index.html before the copies
      # below are generated, so all three pages carry the same numbers.
      # Deploy-time only, never committed — same rule as the beacon and the 404
      # page, so nothing in the repo can drift out of sync.
      #
      # No credentials: park4night's place page is public. The Google numbers
      # beside it are hand-maintained literals, not fetched — the only APIs that
      # serve them either need a billing account or gated OAuth, which is not
      # worth it for a figure that moves a few times a season. A failed lookup
      # warns and keeps the committed numbers, so this step never blocks a
      # deploy.
      - name: Refresh review scores
        run: node .github/scripts/update-reviews.mjs

      # The beacon token is public once the page ships, so it lives in a repo
      # *variable* (Settings → Secrets and variables → Actions → Variables), not
      # a secret. Injecting it here instead of committing it keeps localhost and
      # file:// runs out of the stats. If the variable is missing the site still
      # deploys, just without analytics.
      # SPA route tracking needs no extra work: the beacon hooks pushState and
      # popstate, which is exactly what the router in index.html drives.
      - name: Inject Cloudflare Web Analytics beacon
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: |
          grep -q '<!--CF-ANALYTICS-->' index.html || { echo "::error::CF-ANALYTICS marker missing from index.html"; exit 1; }
          if [ -z "$CF_BEACON_TOKEN" ]; then
            echo "::warning::CF_BEACON_TOKEN variable is not set — deploying without analytics."
            exit 0
          fi
          # Mirrors the snippet Cloudflare's dashboard issues (type="module"),
          # with "spa" stated explicitly: it already defaults to true, but this
          # site depends on SPA route tracking, so it should not be implicit.
          snippet="<!-- Cloudflare Web Analytics --><script type=\"module\" src=\"https://static.cloudflareinsights.com/beacon.min.js\" data-cf-beacon='{\"token\": \"${CF_BEACON_TOKEN}\", \"spa\": true}'></script><!-- End Cloudflare Web Analytics -->"
          sed -i "s|<!--CF-ANALYTICS-->|${snippet}|" index.html
          grep -q 'cloudflareinsights.com/beacon.min.js' index.html || { echo "::error::beacon snippet was not injected"; exit 1; }
          echo "Beacon injected."

      # GitHub Pages has no rewrite rules, so a cold hit on a client-side route
      # (/cjenik, /smjestaj, ...) falls through to 404.html. Shipping a copy of
      # the site there lets the router in index.html read the URL and open the
      # right screen. <base href="/"> is injected because that copy is served
      # from paths other than the root, where index.html's relative asset paths
      # (./support.js, ./uploads/..., ./styles.css) would otherwise resolve
      # against the wrong directory. It is generated here rather than committed
      # so it can never drift out of sync with index.html.
      - name: Generate 404.html SPA fallback
        run: |
          sed 's|<meta charset="utf-8">|<meta charset="utf-8">\n<base href="/">|' index.html > 404.html
          grep -q '<base href="/">' 404.html || { echo "::error::<base> tag was not injected — did the charset meta tag in index.html change?"; exit 1; }
          # Note the if/then: `cmp ... && { exit 1; }` as the final command would
          # leak cmp's non-zero status (the success case here) and fail the step.
          if cmp -s index.html 404.html; then
            echo "::error::404.html is identical to index.html — injection silently did nothing"
            exit 1
          fi
          echo "404.html generated."

      # The enquiry form is the landing page for Google Ads, and Ads disapproves
      # an ad whose final URL answers 404 — which is what every client-side route
      # gets from the step above. So this one route ships as a real directory +
      # index.html and answers 200. Same trick as 404.html (a copy of index.html
      # with <base href="/">, generated rather than committed so it cannot drift),
      # plus canonical/og:url/<title> rewritten to this page so it is its own
      # entity instead of a duplicate of the home page. The router boots from the
      # URL and opens the request screen, exactly as it does via 404.html.
      - name: Generate /posalji-upit/ landing page
        run: |
          mkdir -p posalji-upit
          sed -e 's|<meta charset="utf-8">|<meta charset="utf-8">\n<base href="/">|' \
              -e 's|<title>[^<]*</title>|<title>Send a request — Camping Lovište Paradise</title>|' \
              -e 's|<link rel="canonical" href="https://campinglovisteparadise.com/">|<link rel="canonical" href="https://campinglovisteparadise.com/posalji-upit/">|' \
              -e 's|<meta property="og:url" content="https://campinglovisteparadise.com/">|<meta property="og:url" content="https://campinglovisteparadise.com/posalji-upit/">|' \
              index.html > posalji-upit/index.html
          # Every rewrite is asserted: a silent miss would ship an ads landing
          # page that looks fine but is a duplicate of the home page.
          for needle in \
            '<base href="/">' \
            '<title>Send a request — Camping Lovište Paradise</title>' \
            'rel="canonical" href="https://campinglovisteparadise.com/posalji-upit/"' \
            'property="og:url" content="https://campinglovisteparadise.com/posalji-upit/"'
          do
            grep -qF "$needle" posalji-upit/index.html || { echo "::error::posalji-upit/index.html is missing: $needle"; exit 1; }
          done
          grep -qF "request: '/posalji-upit'" index.html || { echo "::error::the request route in index.html is no longer /posalji-upit — this page would 404 the router back to home"; exit 1; }
          echo "/posalji-upit/ generated."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
